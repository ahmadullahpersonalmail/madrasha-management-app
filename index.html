async function delPost(id){if(!confirm("পোস্টটি মুছবেন?"))return;var r=await sb.from("posts").delete().eq("id",id);if(r.error)return alert(r.error.message);soRef()}
async function cmtOpen(id){var c=$("c_"+id);if(c.innerHTML){c.innerHTML="";return}c.innerHTML='<p class="mu">লোড হচ্ছে…</p>';cmtLoad(id)}
async function cmtLoad(id){var C=(await sb.from("comments").select("*").eq("post_id",id).order("created_at")).data||[];await ppl(C.map(x=>x.user_id));var c=$("c_"+id);if(!c)return;
c.innerHTML=C.map(x=>{var u=pn(x.user_id);return`<div style="display:flex;gap:8px;margin-top:8px">${avH(u,30)}<div style="background:#f1eee3;border-radius:12px;padding:6px 10px;flex:1"><b style="font-size:14px;cursor:pointer" onclick="prof('${x.user_id}')">${esc(u.full_name)}</b><br>${esc(x.body)}<br><small class="mu" style="margin:0">${ago(x.created_at)}${x.user_id==ME.id?` · <a onclick="delCmt('${x.id}','${id}')" style="color:var(--red);cursor:pointer">মুছুন</a>`:""}</small></div></div>`}).join("")+`<div style="display:flex;gap:6px;margin-top:8px"><input id="ci_${id}" placeholder="মন্তব্য লিখুন…" style="margin:0"><button onclick="cmtAdd('${id}')">পাঠান</button></div>`}
async function cmtAdd(id){var v=$("ci_"+id).value.trim();if(!v)return;var r=await sb.from("comments").insert({post_id:id,user_id:ME.id,body:v});if(r.error)return alert(r.error.message);cmtLoad(id)}
async function delCmt(id,pid){if(!confirm("মুছবেন?"))return;await sb.from("comments").delete().eq("id",id);cmtLoad(pid)}
function pRow(u,btn){return`<div class="row" style="align-items:center"><div style="display:flex;gap:10px;align-items:center;cursor:pointer" onclick="prof('${u.id}')">${avH(u)}<div><b>${esc(u.full_name)}</b><small>${esc(u.username||"")}${u.madrasa_name?" · 🏫 "+esc(u.madrasa_name):""}${u.mutual?" · "+bn(u.mutual)+" জন পরিচিত বন্ধু":""}</small></div></div><div style="white-space:nowrap">${btn}</div></div>`}
async function frV(){var b=$("sob");if(!b.innerHTML)b.innerHTML='<p class="mu">লোড হচ্ছে…</p>';var F=(await sb.from("friendships").select("*")).data||[],sg=(await sb.rpc("suggest_people")).data||[];sg.forEach(p=>{PP[p.id]=p});await ppl(F.map(f=>f.requester==ME.id?f.addressee:f.requester));
var inc=F.filter(f=>f.status=="pending"&&f.addressee==ME.id),ok=F.filter(f=>f.status=="ok"),out=F.filter(f=>f.status=="pending"&&f.requester==ME.id);
b.innerHTML=`<div class="card"><h3>বন্ধু খুঁজুন</h3><input id="fs" placeholder="নাম বা ইউজারনেম লিখুন"><button class="full" onclick="frSearch()">খুঁজুন</button><div id="fsr"></div></div>`+
(inc.length?`<div class="card"><h3>বন্ধুত্বের অনুরোধ (${bn(inc.length)})</h3>${inc.map(f=>pRow(pn(f.requester),`<button class="m" onclick="frAns('${f.id}',1)">গ্রহণ</button><button class="d m" onclick="frAns('${f.id}',0)">বাতিল</button>`)).join("")}</div>`:"")+
(sg.length?`<div class="card"><h3>আপনি যাদের চিনতে পারেন</h3>${sg.map(p=>pRow(p,sgBtn(p))).join("")}</div>`:"")+
`<div class="card"><h3>আমার বন্ধু (${bn(ok.length)})</h3>${ok.map(f=>{var o=f.requester==ME.id?f.addressee:f.requester;return pRow(pn(o),`<button class="s m" onclick="chat('${o}')">💬</button><button class="d m" onclick="frAns('${f.id}',0)">সরান</button>`)}).join("")||'<p class="mu">এখনো কোনো বন্ধু নেই</p>'}</div>`+
(out.length?`<div class="card"><h3>পাঠানো অনুরোধ</h3>${out.map(f=>pRow(pn(f.addressee),`<button class="d m" onclick="frAns('${f.id}',0)">বাতিল</button>`)).join("")}</div>`:"")}
async function frSearch(){var q=$("fs").value.trim().replace(/[,()%*]/g,"");if(!q)return;var r=(await sb.from("people").select("*").or(`full_name.ilike.%${q}%,username.ilike.%${q}%`).neq("id",ME.id).limit(20)).data||[],F=(await sb.from("friendships").select("*")).data||[];r.forEach(p=>{PP[p.id]=p});
$("fsr").innerHTML=r.map(p=>{var f=F.find(x=>x.requester==p.id||x.addressee==p.id);return pRow(p,(f?(f.status=="ok"?'<span class="tag ok">বন্ধু</span>':'<span class="tag">অনুরোধ আছে</span>'):`<button class="m" onclick="frAdd('${p.id}')">➕ বন্ধু</button>`)+`<button class="s m" onclick="chat('${p.id}')">💬</button>`)}).join("")||'<p class="mu">কাউকে পাওয়া যায়নি</p>'}
async function frAdd(id){var F=(await sb.from("friendships").select("*")).data||[];if(F.some(x=>x.requester==id||x.addressee==id))return alert("আগে থেকেই অনুরোধ/বন্ধুত্ব আছে");var r=await sb.from("friendships").insert({requester:ME.id,addressee:id});if(r.error)return alert(r.error.message);alert("বন্ধুত্বের অনুরোধ পাঠানো হয়েছে");soRef()}
async function frAns(id,y){var r=y?await sb.from("friendships").update({status:"ok"}).eq("id",id):await sb.from("friendships").delete().eq("id",id);if(r.error)return alert(r.error.message);soRef()}
async function msgV(){if(SO.chat)return chatV();var b=$("sob");b.innerHTML='<p class="mu">লোড হচ্ছে…</p>';var M=(await sb.from("messages").select("*").order("created_at",{ascending:false}).limit(300)).data||[],seen={},L=[],un={};
M.forEach(m=>{var o=m.sender==ME.id?m.receiver:m.sender;if(!seen[o]){seen[o]=1;L.push([o,m])}if(m.receiver==ME.id&&!m.read)un[m.sender]=(un[m.sender]||0)+1});await ppl(L.map(x=>x[0]));
b.innerHTML=`<div class="card"><p class="mu" style="margin:0">নতুন কথা শুরু করতে <a onclick="so('fr')" style="color:var(--navy);text-decoration:underline;cursor:pointer">বন্ধু</a> বা <a onclick="so('dir')" style="color:var(--navy);text-decoration:underline;cursor:pointer">মাদরাসা</a> তালিকা থেকে 💬 চাপুন።</p></div>`+(L.map(x=>{var u=pn(x[0]),m=x[1];return`<div class="card" style="display:flex;gap:10px;align-items:center;cursor:pointer" onclick="chat('${x[0]}')">${avH(u,44)}<div style="flex:1;min-width:0"><b>${esc(u.full_name)}</b>${un[x[0]]?` <span class="tag bad">${bn(un[x[0]])} নতুন</span>`:""}<small class="mu" style="margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${m.sender==ME.id?"আপনি: ":""}${esc(m.body)}</small></div><small class="mu">${ago(m.created_at)}</small></div>`}).join("")||'<div class="card"><p class="mu">এখনো কোনো মেসেজ নেই</p></div>')}
async function chatV(){var id=SO.chat;await ppl([id]);var u=pn(id);$("sob").innerHTML=`<div class="card" style="display:flex;gap:10px;align-items:center"><button class="s m" style="margin:0" onclick="so('msg')">←</button>${avH(u)}<b>${esc(u.full_name)}</b></div><div id="cm_box" class="card" style="min-height:240px"></div><div style="display:flex;gap:6px"><input id="mi" placeholder="মেসেজ লিখুন…" style="margin:0" onkeydown="if(event.key=='Enter')sendM()"><button onclick="sendM()">পাঠান</button></div>`;await chatLoad(true);SO.tmr=setInterval(()=>chatLoad(false),5000)}
async function chatLoad(first){var id=SO.chat;if(!id||!$("cm_box"))return;var M=(await sb.from("messages").select("*").or(`and(sender.eq.${ME.id},receiver.eq.${id}),and(sender.eq.${id},receiver.eq.${ME.id})`).order("created_at").limit(200)).data||[];
$("cm_box").innerHTML=M.map(m=>{var me=m.sender==ME.id;return`<div style="display:flex;justify-content:${me?"flex-end":"flex-start"};margin:4px 0"><div style="max-width:78%;padding:7px 12px;border-radius:14px;background:${me?"var(--navy)":"#f1eee3"};color:${me?"#fff":"var(--ink)"};white-space:pre-wrap">${esc(m.body)}<br><small style="opacity:.6;font-size:11px">${ago(m.created_at)}</small></div></div>`}).join("")||'<p class="mu">কথা শুরু করুন…</p>';
if(first)$("so").scrollTop=$("so").scrollHeight;if(M.some(m=>m.receiver==ME.id&&!m.read))sb.from("messages").update({read:true}).eq("receiver",ME.id).eq("sender",id).eq("read",false).then(()=>{})}
async function sendM(){var i=$("mi"),v=i.value.trim();if(!v)return;i.value="";var r=await sb.from("messages").insert({sender:ME.id,receiver:SO.chat,body:v});if(r.error)return alert(r.error.message);chatLoad(true)}
function dirV(){$("sob").innerHTML=`<div class="card"><input id="ds" placeholder="মাদরাসার নাম বা এলাকা লিখে খুঁজুন" oninput="dirL()" style="margin:0"></div><div id="dl"><p class="mu">লোড হচ্ছে…</p></div>`;dirL()}
async function dirL(){var q=($("ds")||{value:""}).value.trim().replace(/[,()%*]/g,""),s=sb.from("people").select("*").not("madrasa_name","is",null).neq("madrasa_name","");if(q)s=s.or(`madrasa_name.ilike.%${q}%,madrasa_addr.ilike.%${q}%`);var r=(await s.limit(40)).data||[];r.forEach(p=>{PP[p.id]=p});
if(!$("dl"))return;$("dl").innerHTML=r.map(p=>`<div class="card" style="display:flex;gap:10px;align-items:center">${p.madrasa_logo?`<img src="${esc(p.madrasa_logo)}" style="width:56px;height:56px;border-radius:12px;object-fit:cover">`:'<div style="font-size:36px">🕌</div>'}<div style="flex:1"><b>${esc(p.madrasa_name)}</b><br><small class="mu" style="margin:0">${esc(p.madrasa_addr||"")}</small><br><small class="mu" style="margin:0">পরিচালক: ${esc(p.full_name)}</small></div><div style="white-space:nowrap"><button class="s m" onclick="chat('${p.id}')">💬</button><button class="m" onclick="frAdd('${p.id}')">➕</button></div></div>`).join("")||'<div class="card"><p class="mu">কোনো মাদরাসা পাওয়া যায়নি</p></div>'}
setInterval(()=>{if(ME)unread()},30000);

start();
</script></body></html>
